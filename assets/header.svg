<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="blurBg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Styles for CSS animations -->
    <style>
      .pulse-bg {
        animation: pulseOpacity 6s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: floatOne 8s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: floatTwo 7s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 10 15;
        animation: dashMove 20s linear infinite;
      }
      .wave-1 {
        animation: waveMove1 10s ease-in-out infinite alternate;
      }
      .wave-2 {
        animation: waveMove2 12s ease-in-out infinite alternate;
      }
      .stat-bar {
        animation: barGrow 4s ease-in-out infinite alternate;
        transform-origin: bottom;
      }

      @keyframes pulseOpacity {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-15px) rotate(2deg); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(12px) rotate(-2deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -250; }
      }
      @keyframes waveMove1 {
        0% { transform: translateX(0) scaleY(1); }
        100% { transform: translateX(-30px) scaleY(1.1); }
      }
      @keyframes waveMove2 {
        0% { transform: translateX(0) scaleY(1); }
        100% { transform: translateX(30px) scaleY(0.9); }
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Layered behind text) -->
  <g id="background-animations">
    <!-- Glowing Orbs -->
    <circle cx="150" cy="80" r="120" fill="#4f46e5" opacity="0.25" filter="url(#blurBg)" class="pulse-bg" />
    <circle cx="1050" cy="280" r="140" fill="#9333ea" opacity="0.25" filter="url(#blurBg)" class="pulse-bg" />
    <circle cx="900" cy="60" r="90" fill="#ec4899" opacity="0.2" filter="url(#blurBg)" class="pulse-bg" />

    <!-- Grid Pattern Overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
      <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
    </g>

    <!-- Animated Dynamic Flow Lines (Representing Transactions & Event Streams) -->
    <path class="flow-line wave-1" d="M -50 280 Q 300 340 600 270 T 1250 290" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.4" />
    <path class="flow-line wave-2" d="M -50 90 Q 400 20 800 100 T 1250 40" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3" />

    <!-- Left Side Dynamic Element: Ambient Metric Graph (Kept faint & low) -->
    <g transform="translate(60, 160)" opacity="0.25" class="float-card-1">
      <rect width="180" height="120" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" />
      <line x1="20" y1="100" x2="160" y2="100" stroke="#64748b" stroke-width="1" />
      <path d="M 20 80 Q 50 40 80 65 T 140 25 T 160 35" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
      <circle cx="140" cy="25" r="4" fill="#38bdf8" />
    </g>

    <!-- Right Side Dynamic Element: Usage/Metering Visual (Kept opacity low & low z-index) -->
    <g transform="translate(960, 80)" opacity="0.3" class="float-card-2">
      <rect width="180" height="130" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" />
      <!-- Simulated Bar Chart -->
      <rect x="25" y="50" width="16" height="50" rx="3" fill="#6366f1" />
      <rect x="55" y="30" width="16" height="70" rx="3" fill="#a855f7" />
      <rect x="85" y="65" width="16" height="35" rx="3" fill="#38bdf8" />
      <rect x="115" y="20" width="16" height="80" rx="3" fill="#ec4899" filter="url(#glow)" />
      <rect x="145" y="40" width="16" height="60" rx="3" fill="#818cf8" />
    </g>
  </g>

  <!-- FOREGROUND LAYER: MAIN TITLES & SUBTITLES (Guaranteed 100% Crisp Visibility & High Contrast) -->
  <g id="foreground-content" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e1b4b" stroke="url(#primaryGlow)" stroke-width="1.5" />
      <text y="4" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
        💳 RECURRING &amp; USAGE BILLING
      </text>
    </g>

    <!-- Title Line 1: Awesome Billing -->
    <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#textGrad)">Awesome </tspan>
      <tspan fill="url(#accentText)" filter="url(#glow)">Billing</tspan>
    </text>

    <!-- Subtitle Line: Infrastructure & Ecosystem -->
    <text x="600" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="3">
      INFRASTRUCTURE &amp; ECOSYSTEM
    </text>

    <!-- Decorative Divider Line -->
    <line x1="450" y1="225" x2="750" y2="225" stroke="url(#primaryGlow)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Category Pills Foreground Footnote -->
    <g transform="translate(600, 275)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      <!-- Pill 1: Subscription Management -->
      <g transform="translate(-240, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" />
        <text y="5" fill="#e2e8f0">Subscription Mgmt</text>
      </g>
      <!-- Pill 2: Event Metering -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" />
        <text y="5" fill="#e2e8f0">Event Metering</text>
      </g>
      <!-- Pill 3: Payment Orchestration -->
      <g transform="translate(240, 0)">
        <rect x="-90" y="-15" width="180" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" />
        <text y="5" fill="#e2e8f0">Payment Orchestration</text>
      </g>
    </g>
  </g>
</svg>
