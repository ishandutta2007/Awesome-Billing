<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient><linearGradient id="accentText" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="blurBg" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="40"/></filter><style>@keyframes pulseOpacity{0%{opacity:.3;transform:scale(.98)}}@keyframes floatOne{0%{transform:translateY(0) rotate(0deg)}}@keyframes floatTwo{0%{transform:translateY(0) rotate(0deg)}}@keyframes waveMove1{0%{transform:translateX(0) scaleY(1)}}@keyframes waveMove2{0%{transform:translateX(0) scaleY(1)}}.pulse-bg{animation:pulseOpacity 6s ease-in-out infinite alternate}.float-card-1{animation:floatOne 8s ease-in-out infinite alternate}.float-card-2{animation:floatTwo 7s ease-in-out infinite alternate}.flow-line{stroke-dasharray:10 15;anim